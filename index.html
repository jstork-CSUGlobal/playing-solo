<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playing Solo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="title">PLAYING SOLO <span id="chapter">Chapter 1: Kindling</span></div>
    <div class="stats">
      <div class="stat">
        <span class="label">HP</span>
        <div class="bar"><div id="hp-bar" class="fill hp"></div></div>
        <span id="hp-text" class="num"></span>
      </div>
      <div class="stat">
        <span class="label">PP</span>
        <div class="bar"><div id="pp-bar" class="fill pp"></div></div>
        <span id="pp-text" class="num"></span>
      </div>
    </div>
  </header>

  <main id="stage"></main>

  <section id="log-wrap">
    <h3>Log</h3>
    <div id="log" aria-live="polite"></div>
  </section>

  <script src="game.js"></script>
</body>
</html>
